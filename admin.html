<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ფაციფუცობანა — ადმინი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin app">
<div id="gate">
  <div id="gateLogo"></div>
  <p class="muted" style="font-weight:700">PIN-კოდი</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
  <button class="btn primary block lg" id="pinBtn">შესვლა</button>
  <div class="err" id="pinErr"></div>
</div>
<div id="app" class="shell" hidden>
  <aside class="side">
    <div id="sideLogo"></div>
    <button class="nav" data-sec="quiz"><i data-lucide="list-checks"></i>ქვიზები და კითხვები</button>
    <button class="nav" data-sec="rules"><i data-lucide="scale"></i>წესები</button>
    <button class="nav" data-sec="streaks"><i data-lucide="flame"></i>სერიები</button>
    <button class="nav" data-sec="battles"><i data-lucide="swords"></i>ბრძოლები</button>
    <button class="nav" data-sec="polls"><i data-lucide="vote"></i>ხმის მიცემა (MVP)</button>
    <button class="nav" data-sec="images"><i data-lucide="image"></i>სურათები</button>
    <button class="nav" data-sec="sounds"><i data-lucide="volume-2"></i>ხმები</button>
    <button class="nav" data-sec="history"><i data-lucide="history"></i>ისტორია</button>
    <button class="nav" data-sec="settings"><i data-lucide="settings"></i>პარამეტრები</button>
    <div class="side-foot shortcuts">ცვლილებები ავტომატურად ინახება.</div>
  </aside>
  <div class="main">
    <header class="topbar2"><h1 id="pageTitle"></h1><span class="chip ok" id="saveBadge"></span><span class="chip" id="quizChip"></span></header>
    <main class="content" id="view"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="განყოფილებები">
  <button class="nav tab" data-sec="quiz"><i data-lucide="list-checks"></i><span>ქვიზები</span></button>
  <button class="nav tab" data-sec="rules"><i data-lucide="scale"></i><span>წესები</span></button>
  <button class="nav tab" data-sec="streaks"><i data-lucide="flame"></i><span>სერიები</span></button>
  <button class="nav tab" data-sec="images"><i data-lucide="image"></i><span>მედია</span></button>
  <button class="tab" id="moreBtn" data-a="moretabs"><i data-lucide="menu"></i><span>მეტი</span></button>
</nav>
<aside class="drawer" id="drawer" aria-label="კითხვის რედაქტორი">
  <div class="drawer-head"><button class="btn edback" data-a="closeed"><i data-lucide="arrow-left"></i>უკან</button><h2 id="drawerTitle">კითხვა</h2><span class="chip ok edsave" id="edSave"></span><button class="btn quiet icon edx" data-a="closeed" data-tip="დახურვა (Esc)"><i data-lucide="x"></i></button></div>
  <div class="drawer-body" id="edBody"></div>
</aside>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="avatars.js"></script>
<script src="common.js"></script>
<script src="ui.js"></script>
<script src="sfx.js"></script>
<script src="fx.js"></script>
<script src="tvview.js"></script>
<script src="admin.js"></script>
</body>
</html>
