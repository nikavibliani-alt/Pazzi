<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ფაციფუცობანა — წამყვანი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="host app">
<div id="gate">
  <div id="gateLogo"></div>
  <p class="muted" style="font-weight:700">PIN-კოდი</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
  <button class="btn primary block lg" id="pinBtn">შესვლა</button>
  <div class="err" id="pinErr"></div>
</div>
<div id="app" class="shell" hidden>
  <aside class="side">
    <div id="sideLogo"></div>
    <button class="nav" data-sec="g1"><i data-lucide="zap"></i>თამაში 1: ბლიცი</button>
    <button class="nav" data-sec="g2"><i data-lucide="circle-help"></i>თამაში 2: ფაცი თუ ფუცი</button>
    <button class="nav" data-sec="players"><i data-lucide="users"></i>მოთამაშეები</button>
    <button class="nav" data-sec="battles"><i data-lucide="swords"></i>ბრძოლები</button>
    <button class="nav" data-sec="pvote"><i data-lucide="vote"></i>ხმის მიცემა (MVP)</button>
    <button class="nav" data-sec="board"><i data-lucide="trophy"></i>ქულები და ფინალი</button>
    <div class="sec">ტვ ეკრანი</div>
    <div class="tvbox" id="tvBox"></div>
    <div class="sec">საღამო აქამდე</div>
    <div class="tvbox" id="eveBox"></div>
    <div class="side-foot shortcuts" id="keys"></div>
  </aside>
  <div class="main">
    <header class="topbar2"><h1 id="pageTitle"></h1><span class="chip" id="connChip"></span><span class="chip" id="quizChip"></span><span class="chip" id="codeChip"></span><span class="chip" id="plChip"></span><span class="chip" id="wakeChip" hidden></span><span class="chip nowplay" id="nowPlay" hidden></span><span class="grow"></span><button class="btn stopall" data-act="stopall" id="stopAllBtn"><i data-lucide="volume-x"></i>ყველა ხმის გაჩერება</button><button class="btn quiet fresh-top" data-act="reset" id="freshBtn"><i data-lucide="sparkles"></i>ახალი საღამო</button><div class="tvswitch" id="tvSwitch"></div></header>
    <main class="content" id="view"></main>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="avatars.js"></script>
<script src="common.js"></script>
<script src="ui.js"></script>
<script src="host.js"></script>
</body>
</html>
